<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek 快问</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  .bar {
    display: flex; align-items: center; justify-content: flex-end;
    height: 28px; padding: 0 6px;
    background: #f5f5f5; border-bottom: 1px solid #ddd;
    -webkit-app-region: drag; /* draggable frameless window */
    user-select: none;
  }
  .bar button {
    -webkit-app-region: no-drag;
    width: 22px; height: 22px; border: 0; border-radius: 6px;
    background: transparent; color: #666; font-size: 12px; line-height: 1;
    cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .bar button:hover { background: rgba(0,0,0,.08); color: #000; }
  webview { display: flex; width: 100%; height: calc(100% - 28px); border: 0; background: #fff; }
</style>
</head>
<body>
  <div class="bar"><button id="close" title="关闭" aria-label="关闭">&#10005;</button></div>
  <webview id="chat" src="https://chat.deepseek.com/" partition="persist:deepseek-chat"></webview>
  <script>
    document.getElementById('close').addEventListener('click', () => {
      window.__dshChatPanel && window.__dshChatPanel.close()
    })
  </script>
</body>
</html>
